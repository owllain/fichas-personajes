<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Archivo de Personajes</title>
    <!-- Fuentes futuristas -->
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-gold: #ffd700;
            --neon-red: #e11d48;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
                url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            color: white;
            height: 100vh;
            overflow: hidden;
            /* CRUCIAL: Evita doble scroll */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- CONTENEDOR PRINCIPAL (Menu) --- */
        #main-menu {
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.8s ease;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            /* Scroll solo si es necesario en el menú */
        }

        body.viewing #main-menu {
            transform: scale(0.9) translateY(-50px);
            opacity: 0;
            pointer-events: none;
        }

        /* Título */
        .nexus-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            text-transform: uppercase;
            letter-spacing: 15px;
            margin: 40px 0 60px 0;
            position: relative;
            color: white;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
            animation: glow 3s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
            }

            to {
                text-shadow: 0 0 30px rgba(0, 243, 255, 0.8), 0 0 10px white;
            }
        }

        .nexus-title::after {
            content: 'SYSTEM ARCHIVE_V.2.0';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 5px;
            color: var(--neon-purple);
            opacity: 0.8;
        }

        /* Grid de Cartas */
        .char-grid {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            max-width: 1400px;
            z-index: 10;
        }

        .char-card {
            width: 320px;
            height: 500px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        .char-card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .card-bg {
            height: 100%;
            width: 100%;
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.8s ease;
            z-index: 0;
            mask-image: linear-gradient(to bottom, black 40%, transparent 95%);
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 95%);
            opacity: 0.8;
        }

        .char-card:hover .card-bg {
            transform: scale(1.1);
            opacity: 1;
        }

        .card-content {
            z-index: 2;
            margin-top: auto;
            padding: 30px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.6), transparent);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .card-line {
            position: absolute;
            top: 0;
            left: 0;
            height: 2px;
            width: 0%;
            background: white;
            transition: width 0.5s ease;
        }

        .char-card:hover .card-line {
            width: 100%;
        }

        .char-role {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            display: block;
            font-weight: 700;
        }

        .char-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            line-height: 1;
            color: white;
        }

        .btn-access {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        .char-card:hover .btn-access {
            background: white;
            color: black;
            border-color: white;
        }

        /* Estilos Específicos */
        .card-klein:hover {
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
        }

        .card-klein .char-role {
            color: var(--neon-gold);
        }

        .card-klein .card-line {
            background: var(--neon-gold);
        }

        .card-klein:hover .btn-access {
            background: var(--neon-gold);
            border-color: var(--neon-gold);
            color: black;
        }

        .card-kazui:hover {
            box-shadow: 0 0 40px rgba(225, 29, 72, 0.3);
        }

        .card-kazui .char-role {
            color: var(--neon-red);
        }

        .card-kazui .card-line {
            background: var(--neon-red);
        }

        .card-kazui:hover .btn-access {
            background: var(--neon-red);
            border-color: var(--neon-red);
            color: white;
        }

        .card-eliphas:hover {
            box-shadow: 0 0 40px rgba(188, 19, 254, 0.2);
        }

        .card-eliphas .char-role {
            color: var(--neon-purple);
        }

        .card-eliphas .card-line {
            background: var(--neon-purple);
        }

        .card-eliphas:hover .btn-access {
            background: var(--neon-purple);
            border-color: var(--neon-purple);
            color: white;
        }

        .card-nox:hover {
            box-shadow: 0 0 45px rgba(121, 215, 66, 0.35);
        }

        .card-nox .char-role {
            color: #79d742;
        }

        .card-nox .card-line {
            background: #79d742;
        }

        .card-nox:hover .btn-access {
            background: #79d742;
            border-color: #c5ff9a;
            color: #031005;
        }

        /* --- VISOR DE FICHAS (MODAL) --- */
        #char-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            backdrop-filter: blur(10px);
            overflow: hidden;
            /* IMPORTANTE: El scroll debe ser interno del iframe */
        }

        body.viewing #char-viewer {
            opacity: 1;
            pointer-events: auto;
        }

        .viewer-toolbar {
            height: 60px;
            min-height: 60px;
            /* Evita que se aplaste */
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0 30px;
            justify-content: space-between;
            position: relative;
            z-index: 101;
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 20px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            border-radius: 4px;
            z-index: 5;
        }

        .btn-back:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 3px;
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
            transition: all 0.3s ease;
        }

        .loader.blink {
            animation: blink 2s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.3;
            }
        }

        /* IFRAME: Ocupa todo el espacio restante y maneja su propio scroll */
        #viewer-frame {
            display: block;
            width: 100%;
            height: calc(100% - 60px);
            /* Restamos el toolbar */
            border: none;
            opacity: 0;
            transition: opacity 0.5s ease 0.3s;
            background: transparent;
            /* Importante para que no se vea blanco al cargar */
        }

        body.viewing #viewer-frame {
            opacity: 1;
        }

        .status-right {
            font-family: 'Rajdhani';
            letter-spacing: 2px;
            font-size: 0.8rem;
            opacity: 0.7;
            text-align: right;
            z-index: 5;
        }
    </style>
</head>

<body>

    <!-- MENÚ PRINCIPAL -->
    <div id="main-menu">
        <h1 class="nexus-title">NEXUS</h1>

        <div class="char-grid">

            <!-- CARTA KLEIN -->
            <div class="char-card card-klein" onclick="openViewer('Ficha_Klein.html', 'var(--neon-gold)')">
                <div class="card-bg" style="background-image: url('https://i.imgur.com/F4iaW71.jpeg');">
                </div>
                <div class="card-content">
                    <div class="card-line"></div>
                    <span class="char-role">El señor de los misterios</span>
                    <h2 class="char-name">Klein Moretti</h2>
                    <div class="btn-access">Acceder Datos</div>
                </div>
            </div>

            <!-- CARTA KAZUI -->
            <div class="char-card card-kazui" onclick="openViewer('Ficha_Kazui.html', 'var(--neon-red)')">
                <div class="card-bg" style="background-image: url('https://i.imgur.com/0VBHHwT.jpeg');"></div>
                <div class="card-content">
                    <div class="card-line"></div>
                    <span class="char-role">El presagista del fin</span>
                    <h2 class="char-name">Kazui von Vitra</h2>
                    <div class="btn-access">Acceder Datos</div>
                </div>
            </div>

            <!-- CARTA ELIPHAS -->
            <div class="char-card card-eliphas" onclick="openViewer('Ficha_Eliphas.html', 'var(--neon-purple)')">
                <div class="card-bg" style="background-image: url('https://i.imgur.com/XOirDde.jpeg');">
                </div>
                <div class="card-content">
                    <div class="card-line"></div>
                    <span class="char-role">De la biblioteca maldita</span>
                    <h2 class="char-name">Eliphas Lévi</h2>
                    <div class="btn-access">Acceder Datos</div>
                </div>
            </div>

            <!-- CARTA NOX -->
            <div class="char-card card-nox" onclick="openViewer('Ficha_Nox.html', '#79d742')">
                <div class="card-bg" style="background-image: linear-gradient(rgba(2, 16, 5, 0.18), rgba(0, 0, 0, 0.25)), url('https://i.imgur.com/6yX3C5Y.jpeg');">
                </div>
                <div class="card-content">
                    <div class="card-line"></div>
                    <span class="char-role">El dragón que se tragó al sol</span>
                    <h2 class="char-name">Nox Arcana</h2>
                    <div class="btn-access">Acceder Datos</div>
                </div>
            </div>

        </div>
    </div>

    <!-- VISOR / CONTENEDOR DE FICHAS -->
    <div id="char-viewer">
        <div class="viewer-toolbar">

            <!-- Botón Izquierda -->
            <button class="btn-back" onclick="closeViewer()">
                <span>←</span> Desconectar
            </button>

            <!-- Texto Central -->
            <div id="system-msg" class="loader blink">ESTABLECIENDO ENLACE...</div>

            <!-- Estado Derecha -->
            <div class="status-right">
                SECURE CONNECTION // <span id="status-color" style="color: white;">ACTIVE</span>
            </div>

        </div>

        <iframe id="viewer-frame" src=""></iframe>
    </div>

    <script>
        const viewer = document.getElementById('char-viewer');
        const frame = document.getElementById('viewer-frame');
        const body = document.body;
        const statusText = document.getElementById('status-color');
        const systemMsg = document.getElementById('system-msg');

        function openViewer(url, color) {
            systemMsg.textContent = "ESTABLECIENDO ENLACE...";
            systemMsg.classList.add('blink');
            systemMsg.style.color = "var(--neon-blue)";
            systemMsg.style.textShadow = "0 0 5px var(--neon-blue)";

            statusText.style.color = color;
            statusText.style.textShadow = `0 0 10px ${color}`;

            frame.src = url;
            body.classList.add('viewing');

            frame.onload = function () {
                setTimeout(() => {
                    systemMsg.textContent = "SINCRONIZACIÓN COMPLETA";
                    systemMsg.classList.remove('blink');
                    systemMsg.style.color = color;
                    systemMsg.style.textShadow = `0 0 10px ${color}`;
                }, 800);
            };
        }

        function closeViewer() {
            body.classList.remove('viewing');
            setTimeout(() => {
                frame.src = "";
                systemMsg.textContent = "CERRANDO CONEXIÓN...";
                systemMsg.style.color = "var(--neon-blue)";
            }, 500);
        }
    </script>

</body>

</html>
