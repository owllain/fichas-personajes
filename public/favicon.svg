<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c5ff9a" stop-opacity="1" />
      <stop offset="50%" stop-color="#79d742" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#050706" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="ringGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gemEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5ff9a" />
      <stop offset="50%" stop-color="#79d742" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark outer disc -->
  <circle cx="32" cy="32" r="30" fill="#060907" stroke="#1f3724" stroke-width="1.5" />

  <!-- Outer orbital rings -->
  <circle cx="32" cy="32" r="25" stroke="url(#ringViolet)" stroke-width="1.2" stroke-dasharray="8 4 2 4" opacity="0.85" />
  <circle cx="32" cy="32" r="21" stroke="url(#ringGold)" stroke-width="1" stroke-dasharray="14 6" opacity="0.75" />

  <!-- Core background aura -->
  <circle cx="32" cy="32" r="16" fill="url(#coreGlow)" opacity="0.7" />

  <!-- Central NEXUS Rhombus / Octahedron Sigil -->
  <polygon points="32,8 50,32 32,56 14,32" fill="#0c1810" stroke="url(#gemEdge)" stroke-width="2" filter="url(#glow)" />
  <polygon points="32,15 45,32 32,49 19,32" fill="#12281b" stroke="#79d742" stroke-width="1" opacity="0.9" />

  <!-- Inner Diamond & Energy Core -->
  <polygon points="32,22 40,32 32,42 24,32" fill="#79d742" opacity="0.35" />
  <circle cx="32" cy="32" r="4" fill="#ffffff" filter="url(#glow)" />
  
  <!-- Cardinal alignment nodes -->
  <circle cx="32" cy="8" r="2" fill="#c5ff9a" />
  <circle cx="50" cy="32" r="2" fill="#fbbf24" />
  <circle cx="32" cy="56" r="2" fill="#c084fc" />
  <circle cx="14" cy="32" r="2" fill="#79d742" />
</svg>
